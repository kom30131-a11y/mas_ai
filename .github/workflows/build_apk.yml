name: Build MAS AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android .
      - name: Add ML Kit Android dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          dependencies = """dependencies {
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          """

          if "dependencies {" in text:
              if "text-recognition-chinese:16.0.1" not in text:
                  text = text.replace(
                      "dependencies {",
                      dependencies.rstrip(),
                      1,
                  )
          else:
              text = text.rstrip() + "\n\n" + dependencies

          path.write_text(text)
          PY

          grep -n "text-recognition-" android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mas-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
