name: Build MAS AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android .

      - name: Configure MAS AI Android storage
        run: |
          cat > android/app/src/main/kotlin/com/example/mas_ai/MainActivity.kt <<'EOF'
          package com.example.mas_ai

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.documentfile.provider.DocumentFile
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              private val channelName = "mas_ai/storage"
              private val requestCode = 1001

              private val prefsName = "mas_ai_storage"
              private val prefsKey = "tree_uri"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->

                      when (call.method) {
                          "isStorageConfigured" -> {
                              result.success(getSavedUri() != null)
                          }

                          "getStorageUri" -> {
                              result.success(getSavedUri())
                          }

                          "chooseStorageFolder" -> {
                              chooseStorageFolder()
                              pendingResult = result
                          }

                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }

              private var pendingResult: MethodChannel.Result? = null

              private fun chooseStorageFolder() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                      addFlags(
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                          Intent.FLAG_GRANT_WRITE_URI_PERMISSION or
                          Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                      )
                  }

                  startActivityForResult(intent, requestCode)
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != this.requestCode) {
                      return
                  }

                  if (resultCode != RESULT_OK || data?.data == null) {
                      pendingResult?.success(false)
                      pendingResult = null
                      return
                  }

                  val selectedUri = data.data!!

                  try {
                      contentResolver.takePersistableUriPermission(
                          selectedUri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                          Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      )

                      val selectedFolder =
                          DocumentFile.fromTreeUri(this, selectedUri)

                      if (selectedFolder == null || !selectedFolder.canWrite()) {
                          pendingResult?.success(false)
                          pendingResult = null
                          return
                      }

                      val masAiFolder =
                          selectedFolder.findFile("MAS AI")
                              ?: selectedFolder.createDirectory("MAS AI")

                      if (masAiFolder == null) {
                          pendingResult?.success(false)
                          pendingResult = null
                          return
                      }

                      createDirectoryIfMissing(masAiFolder, "Content")
                      createDirectoryIfMissing(masAiFolder, "Backups")
                      createDirectoryIfMissing(masAiFolder, "Exports")

                      saveUri(masAiFolder.uri.toString())

                      pendingResult?.success(true)
                  } catch (e: Exception) {
                      pendingResult?.success(false)
                  }

                  pendingResult = null
              }

              private fun createDirectoryIfMissing(
                  parent: DocumentFile,
                  name: String
              ): DocumentFile? {
                  return parent.findFile(name)
                      ?: parent.createDirectory(name)
              }

              private fun saveUri(uri: String) {
                  getSharedPreferences(
                      prefsName,
                      MODE_PRIVATE
                  ).edit()
                      .putString(prefsKey, uri)
                      .apply()
              }

              private fun getSavedUri(): String? {
                  return getSharedPreferences(
                      prefsName,
                      MODE_PRIVATE
                  ).getString(prefsKey, null)
              }
          }
          EOF
          
      - name: Add Android dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          additions = [
              '    implementation("androidx.documentfile:documentfile:1.1.0")',
              '    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
              '    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
              '    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
              '    implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
          ]

          if "implementation(\"androidx.documentfile:documentfile:1.1.0\")" not in text:
              marker = "dependencies {"
              block = marker + "\n" + "\n".join(additions)
              text = text.replace(marker, block, 1)

          path.write_text(text)
          PY

          grep -n "documentfile\|text-recognition-" android/app/build.gradle.kts
      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mas-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
