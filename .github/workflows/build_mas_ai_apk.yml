name: Build MedLibra APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 3. Remove old generated Android files
        run: |
          rm -rf android
          rm -rf .dart_tool
          rm -rf build

      - name: 4. Create fresh Android project
        run: |
          flutter create --platforms=android .

      - name: 4.1 Remove generated Flutter test
        run: |
          rm -f test/widget_test.dart

      - name: 4.2 Set MedLibra app name and storage permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()

          updated = re.sub(
              r'android:label="[^"]*"',
              'android:label="MedLibra"',
              text,
              count=1,
          )

          if updated == text:
              raise SystemExit(
                  'Could not find android:label in AndroidManifest.xml'
              )

          text = updated

          permission = (
              '<uses-permission '
              'android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />'
          )

          if permission not in text:
              manifest_tag = (
                  '<manifest '
                  'xmlns:android="http://schemas.android.com/apk/res/android">'
              )

              if manifest_tag not in text:
                  raise SystemExit(
                      'Could not find the manifest tag in AndroidManifest.xml'
                  )

              text = text.replace(
                  manifest_tag,
                  manifest_tag + '\n    ' + permission,
                  1,
              )

          path.write_text(text)
          PY

          grep -q 'android:label="MedLibra"' \
            android/app/src/main/AndroidManifest.xml

          grep -q 'MANAGE_EXTERNAL_STORAGE' \
            android/app/src/main/AndroidManifest.xml

      - name: 5. Configure Android compatibility
        shell: bash
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.builtInKotlin=false
          android.newDsl=false
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/build.gradle.kts')
          text = path.read_text()

          marker = (
              '// file_picker 11.x compatibility with AGP 9 legacy Kotlin mode.'
          )

          block = '''
          // file_picker 11.x compatibility with AGP 9 legacy Kotlin mode.
          subprojects {
              if (name == "file_picker") {
                  apply(plugin = "org.jetbrains.kotlin.android")
                  tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                      compilerOptions {
                          jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                      }
                  }
              }
          }
          '''

          if marker not in text:
              text = text.rstrip() + '\n\n' + block
              path.write_text(text)
          PY

      - name: 6. Configure Android storage channel
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/mas_ai

          cat > android/app/src/main/kotlin/com/example/mas_ai/MainActivity.kt <<'EOF'
          package com.example.mas_ai

          import android.content.Intent
          import androidx.documentfile.provider.DocumentFile
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              private val channelName = "mas_ai/storage"
              private val requestCode = 1001
              private val prefsName = "mas_ai_storage"
              private val prefsKey = "tree_uri"

              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->

                      when (call.method) {

                          "isStorageConfigured" -> {
                              result.success(
                                  getSavedUri() != null
                              )
                          }

                          "getStorageUri" -> {
                              result.success(
                                  getSavedUri()
                              )
                          }

                          "chooseStorageFolder" -> {
                              pendingResult = result
                              chooseStorageFolder()
                          }

                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }

              private fun chooseStorageFolder() {
                  val intent = Intent(
                      Intent.ACTION_OPEN_DOCUMENT_TREE
                  ).apply {
                      addFlags(
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION or
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                      )
                  }

                  startActivityForResult(
                      intent,
                      requestCode
                  )
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (requestCode != this.requestCode) {
                      return
                  }

                  val result = pendingResult
                  pendingResult = null

                  if (
                      resultCode != RESULT_OK ||
                      data?.data == null
                  ) {
                      result?.success(false)
                      return
                  }

                  val selectedUri = data.data!!

                  try {
                      contentResolver.takePersistableUriPermission(
                          selectedUri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      )

                      val selectedFolder =
                          DocumentFile.fromTreeUri(
                              this,
                              selectedUri
                          )

                      if (
                          selectedFolder == null ||
                          !selectedFolder.canWrite()
                      ) {
                          result?.success(false)
                          return
                      }

                      val masAiFolder =
                          selectedFolder.findFile("MAS AI")
                              ?: selectedFolder.createDirectory("MAS AI")

                      if (masAiFolder == null) {
                          result?.success(false)
                          return
                      }

                      createDirectoryIfMissing(
                          masAiFolder,
                          "Content"
                      )

                      createDirectoryIfMissing(
                          masAiFolder,
                          "Backups"
                      )

                      createDirectoryIfMissing(
                          masAiFolder,
                          "Exports"
                      )

                      saveUri(
                          masAiFolder.uri.toString()
                      )

                      result?.success(true)

                  } catch (_: Exception) {
                      result?.success(false)
                  }
              }

              private fun createDirectoryIfMissing(
                  parent: DocumentFile,
                  name: String
              ): DocumentFile? {
                  return parent.findFile(name)
                      ?: parent.createDirectory(name)
              }

              private fun saveUri(uri: String) {
                  getSharedPreferences(
                      prefsName,
                      MODE_PRIVATE
                  ).edit()
                      .putString(
                          prefsKey,
                          uri
                      )
                      .apply()
              }

              private fun getSavedUri(): String? {
                  return getSharedPreferences(
                      prefsName,
                      MODE_PRIVATE
                  ).getString(
                      prefsKey,
                      null
                  )
              }
          }
          EOF

      - name: 7. Add Android dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text()

          dependencies = [
              'implementation("androidx.documentfile:documentfile:1.1.0")',
              'implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
          ]

          missing = [
              dependency
              for dependency in dependencies
              if dependency not in text
          ]

          if missing:
              block = (
                  '\n\ndependencies {\n'
                  + '\n'.join(
                      '    ' + dependency
                      for dependency in missing
                  )
                  + '\n}\n'
              )

              path.write_text(
                  text.rstrip() + block
              )
          PY

      - name: 8. Verify Android configuration
        shell: bash
        run: |
          test -f android/app/src/main/kotlin/com/example/mas_ai/MainActivity.kt

          grep -q 'MANAGE_EXTERNAL_STORAGE' \
            android/app/src/main/AndroidManifest.xml

          grep -q 'android:label="MedLibra"' \
            android/app/src/main/AndroidManifest.xml

          grep -q 'android.builtInKotlin=false' \
            android/gradle.properties

          grep -q 'android.newDsl=false' \
            android/gradle.properties

          grep -q 'file_picker 11.x compatibility' \
            android/build.gradle.kts

          grep -q 'androidx.documentfile:documentfile:1.1.0' \
            android/app/build.gradle.kts

      - name: 9. Get Flutter dependencies
        run: |
          flutter pub get

      - name: 10. Generate MedLibra launcher icon
        shell: bash
        run: |
          test -f assets/icon/mas_ai_icon.png
          test -f assets/icon/mas_ai_icon_foreground.png

          dart run flutter_launcher_icons

          test -d android/app/src/main/res/mipmap-hdpi
          test -d android/app/src/main/res/mipmap-xhdpi
          test -d android/app/src/main/res/mipmap-xxhdpi

      - name: 11. Analyze Flutter project
        run: |
          flutter analyze

      - name: 12. Build release APK
        run: |
          flutter build apk --release

      - name: 13. Verify APK
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk

      - name: 14. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medlibra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
