name: Build MAS AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 3. Remove old generated Android files
        run: |
          rm -rf android
          rm -rf .dart_tool
          rm -rf build

      - name: 4. Create fresh Android project
        run: |
          flutter create --platforms=android .

      - name: 4.1 Remove generated Flutter test
        run: |
          rm -f test/widget_test.dart

      - name: 5. Configure Android compatibility
        shell: bash
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.builtInKotlin=false
          android.newDsl=false
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle.kts")
          text = path.read_text()

          marker = "// file_picker 11.x compatibility with AGP 9 legacy Kotlin mode."

          block = '''
          // file_picker 11.x compatibility with AGP 9 legacy Kotlin mode.
          subprojects {
              if (name == "file_picker") {
                  apply(plugin = "org.jetbrains.kotlin.android")

                  tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                      compilerOptions {
                          jvmTarget.set(
                              org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                          )
                      }
                  }
              }
          }
          '''

          if marker not in text:
              text = text.rstrip() + "\n\n" + block
              path.write_text(text)

          print("Android Gradle compatibility configured.")
          PY

      - name: 6. Configure Android storage
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/mas_ai

          cat > android/app/src/main/kotlin/com/example/mas_ai/MainActivity.kt <<'EOF'
          package com.example.mas_ai

          import android.content.Intent
          import androidx.documentfile.provider.DocumentFile
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              private val channelName = "mas_ai/storage"
              private val requestCode = 1001
              private val prefsName = "mas_ai_storage"
              private val prefsKey = "tree_uri"
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "isStorageConfigured" -> result.success(getSavedUri() != null)

                          "getStorageUri" -> result.success(getSavedUri())

                          "chooseStorageFolder" -> {
                              pendingResult = result
                              chooseStorageFolder()
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              private fun chooseStorageFolder() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                      addFlags(
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                          Intent.FLAG_GRANT_WRITE_URI_PERMISSION or
                          Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                      )
                  }

                  startActivityForResult(intent, requestCode)
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != this.requestCode) return

                  val result = pendingResult
                  pendingResult = null

                  if (resultCode != RESULT_OK || data?.data == null) {
                      result?.success(false)
                      return
                  }

                  val selectedUri = data.data!!

                  try {
                      contentResolver.takePersistableUriPermission(
                          selectedUri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      )

                      val selectedFolder =
                          DocumentFile.fromTreeUri(this, selectedUri)

                      if (selectedFolder == null || !selectedFolder.canWrite()) {
                          result?.success(false)
                          return
                      }

                      val masAiFolder =
                          selectedFolder.findFile("MAS AI")
                              ?: selectedFolder.createDirectory("MAS AI")

                      if (masAiFolder == null) {
                          result?.success(false)
                          return
                      }

                      createDirectoryIfMissing(masAiFolder, "Content")
                      createDirectoryIfMissing(masAiFolder, "Backups")
                      createDirectoryIfMissing(masAiFolder, "Exports")

                      saveUri(masAiFolder.uri.toString())
                      result?.success(true)
                  } catch (e: Exception) {
                      result?.success(false)
                  }
              }

              private fun createDirectoryIfMissing(
                  parent: DocumentFile,
                  name: String
              ): DocumentFile? {
                  return parent.findFile(name)
                      ?: parent.createDirectory(name)
              }

              private fun saveUri(uri: String) {
                  getSharedPreferences(prefsName, MODE_PRIVATE)
                      .edit()
                      .putString(prefsKey, uri)
                      .apply()
              }

              private fun getSavedUri(): String? {
                  return getSharedPreferences(prefsName, MODE_PRIVATE)
                      .getString(prefsKey, null)
              }
          }
          EOF

      - name: 7. Add Android dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          dependencies = [
              'implementation("androidx.documentfile:documentfile:1.1.0")',
              'implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
          ]

          missing = [dep for dep in dependencies if dep not in text]

          if missing:
              block = "\n\ndependencies {\n" + "\n".join(
                  f"    {dep}" for dep in missing
              ) + "\n}\n"

              path.write_text(text.rstrip() + block)

          final_text = path.read_text()

          for dep in dependencies:
              if dep not in final_text:
                  raise SystemExit(
                      f"ERROR: Missing dependency: {dep}"
                  )

          print("Android dependencies verified.")
          PY

      - name: 8. Verify Android configuration
        shell: bash
        run: |
          test -f android/app/src/main/kotlin/com/example/mas_ai/MainActivity.kt
          test -f android/app/build.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties

          grep -q 'android.builtInKotlin=false' android/gradle.properties
          grep -q 'android.newDsl=false' android/gradle.properties
          grep -q 'file_picker 11.x compatibility' android/build.gradle.kts

          grep -q 'androidx.documentfile:documentfile:1.1.0' \
            android/app/build.gradle.kts

          grep -q 'text-recognition-chinese:16.0.1' \
            android/app/build.gradle.kts

          grep -q 'text-recognition-devanagari:16.0.1' \
            android/app/build.gradle.kts

          grep -q 'text-recognition-japanese:16.0.1' \
            android/app/build.gradle.kts

          grep -q 'text-recognition-korean:16.0.1' \
            android/app/build.gradle.kts

          echo "Android configuration verified successfully."

      - name: 9. Get Flutter dependencies
        run: |
          flutter pub get

      - name: 9.1 Patch flutter_isolate Android compatibility
        shell: bash
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/flutter_isolate-2.1.0/android/src/main/java/com/rmawatson/flutterisolate/FlutterIsolatePlugin.java"

          test -f "$FILE"

          sed -i \
            '/import io\.flutter\.view\.FlutterRunArguments;/d' \
            "$FILE"

          if grep -q 'FlutterRunArguments' "$FILE"; then
            echo "ERROR: FlutterRunArguments is still referenced."
            exit 1
          fi

          echo "flutter_isolate Android compatibility patched successfully."

      - name: 10. Analyze Flutter project
        run: |
          flutter analyze

      - name: 11. Build release APK
        run: |
          flutter build apk --release

      - name: 12. Verify APK
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: 13. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mas-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
